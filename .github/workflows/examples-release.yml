name: Examples Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact default-branch SDK source and workflow SHA
        required: true
      sdk_version:
        description: Exact independently published Python SDK version
        required: true
      core_tag:
        description: Exact independent published core tag
        required: true
      core_commit:
        description: Exact core commit
        required: true
      candidate_run_id:
        description: Explicit original signed SDK candidate run ID
        required: true
      candidate_run_attempt:
        description: Explicit original signed SDK candidate attempt
        required: true
      completion_run_id:
        description: Explicit successful independent SDK completion run ID
        required: true
      completion_run_attempt:
        description: Explicit successful independent SDK completion attempt
        required: true
      completion_source_sha:
        description: Exact completion workflow source SHA, equal to source_sha in this version
        required: true
      platform:
        description: Exact core candidate platform matching ubuntu-24.04
        required: true

permissions:
  contents: write

concurrency:
  group: python-sdk-release
  cancel-in-progress: false

jobs:
  examples-release:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # Preserve Git blob bytes so checkout cannot change authenticated source digests.
      # 保留 Git blob 原字节，避免检出改变已认证的源摘要。
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LuaSkills/luaskills
          ref: ${{ inputs.core_commit }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: control
        with:
          python-version: '3.14'
      - run: '"${{ steps.control.outputs.python-path }}" -m pip install $("${{ steps.control.outputs.python-path }}" sdk/scripts/release/sdk_release.py tool-requirements)'
      - name: Resolve actual published core toolchain for the fresh consumer
        id: bootstrap
        env:
          CORE_TAG: ${{ inputs.core_tag }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.control.outputs.python-path }}" -X utf8 sdk/scripts/release/sdk_release.py bootstrap
          --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT" --core-root core
          --output "${{ runner.temp }}/bootstrap" --github-output "$GITHUB_OUTPUT"
      # Only the common authority selects the version; its complete recheck validates the installed identity.
      # 仅公共权威选择版本；其完整重查验证安装后的身份。
      - name: Install the exact published core toolchain
        env:
          TOOLCHAIN: ${{ steps.bootstrap.outputs.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      # Fresh consumption authenticates successful issuer and public bytes before packaging.
      # 打包前，新消费认证成功签发任务及公共字节。
      - name: Authenticate formal publication and cold-install exact PyPI package
        env:
          SDK_SOURCE_SHA: ${{ inputs.source_sha }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          CORE_TAG: ${{ inputs.core_tag }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPLETION_RUN_ID: ${{ inputs.completion_run_id }}
          COMPLETION_RUN_ATTEMPT: ${{ inputs.completion_run_attempt }}
          COMPLETION_SOURCE_SHA: ${{ inputs.completion_source_sha }}
          PLATFORM: ${{ inputs.platform }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.control.outputs.python-path }}" -X utf8 sdk/scripts/release/sdk_release.py formal-proof
          --source-sha "$SDK_SOURCE_SHA" --sdk-version "$SDK_VERSION" --core-tag "$CORE_TAG"
          --core-commit "$CORE_COMMIT" --candidate-run-id "$CANDIDATE_RUN_ID" --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT"
          --completion-run-id "$COMPLETION_RUN_ID" --completion-run-attempt "$COMPLETION_RUN_ATTEMPT"
          --completion-source-sha "$COMPLETION_SOURCE_SHA" --platform "$PLATFORM"
          --core-root core --output formal-publication
      - name: Execute and package tracked examples with official installed SDK
        run: >-
          "${{ steps.control.outputs.python-path }}" -X utf8 sdk/scripts/release/sdk_release.py examples
          --formal-proof formal-publication --root sdk --output examples-assets
      # Preserve original deterministic ZIP/sidecar before public release mutation; retries must reproduce identical bytes.
      # 在公共发行修改前保留原确定性 ZIP 及摘要文件；重试必须复现相同字节。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: examples-bytes-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: examples-assets/*
          if-no-files-found: error
      # Equal existing bytes are reused; a different digest fails without overwriting.
      # 复用相同现有字节；摘要不同则失败而不覆盖。
      - name: Publish independent examples assets through a complete draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.control.outputs.python-path }}" -X utf8 sdk/scripts/release/sdk_release.py publish-examples
          --formal-proof formal-publication --assets examples-assets --core-root core
